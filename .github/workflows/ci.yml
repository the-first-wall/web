name: Site checks

# Pull-request checks for the site itself: the publisher's regression tests
# (escaping, validation, anchor check), the mock-data linter, the DOM target
# check, the shared-chrome check (every page carries partials/header.html and
# partials/footer.html) and the language-route check (en/ and de/ are generated from
# the authored pages in src/). No secrets, read-only token.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'records/**'
      - 'w1/**'
      - 'assets/**'
      - 'souls/**'
      - 'anchors.json'
      - 'anchor_status.json'
      - 'state.json'
      - 'settlements.json'
      - 'census.json'
      - 'census.md'
      - 'sitemap.xml'
      - 'feed.xml'

permissions:
  contents: read

jobs:
  checks:
    name: Publisher tests, lint, DOM targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Pillow==12.3.0"

      - name: Publisher regression tests
        run: python scripts/test_sync_from_ledger.py

      - name: Language route tests
        run: python scripts/test_build_i18n.py

      - name: Language routes (/en/, /de/) match src/
        run: python scripts/build_i18n.py --check

      - name: Mock-data linter
        run: python scripts/lint_no_mock_data.py

      - name: DOM targets and i18n keys
        run: node scripts/verify_dom_targets.js

      - name: Header and footer identical on every page
        run: python scripts/build_chrome.py --check

      - name: No inline script or handlers (the CSP forbids them)
        run: |
          set -u
          # <script> without src=, except JSON-LD data blocks
          hits=$(grep -rn --include='*.html' --exclude-dir=.git -P '<script(?![^>]*\bsrc=)(?![^>]*application/ld\+json)[^>]*>' . || true)
          # on*= attributes inside a tag
          hits="$hits$(grep -rn --include='*.html' --exclude-dir=.git -P '<[^>]*\son[a-z]+\s*=' . || true)"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::inline script or event handler found"
            exit 1
          fi
          echo "no inline script or handlers"
