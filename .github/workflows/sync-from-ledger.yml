name: Sync from Ledger

# Keeps the site in lock-step with the ledger (the source of truth).
# Runs entirely in the cloud — no operator machine involved. The ledger is
# public, so this needs NO cross-repo secrets: we clone it, rebuild the derived
# site artifacts, and commit them straight to this repo's main branch
# (GitHub Pages then deploys automatically).

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-from-ledger
  cancel-in-progress: false

jobs:
  sync:
    name: Rebuild site from ledger
    runs-on: ubuntu-latest
    steps:
      - name: Check out site repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Rebuild derived artifacts from the public ledger
        env:
          LEDGER_REPO: https://github.com/the-first-wall/ledger.git
        run: python scripts/sync_from_ledger.py

      - name: Commit & push if the ledger moved
        run: |
          git config user.name  "the-first-wall-bot"
          git config user.email "bot@thefirstwall.ai"
          git add -A
          if git diff --quiet --cached; then
            echo "Ledger unchanged — nothing to publish."
            exit 0
          fi
          git commit -m "chore(site): sync from ledger @ $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase --autostash origin main
          git push
