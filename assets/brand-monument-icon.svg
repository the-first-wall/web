<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="m-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="m-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#283147" />
      <stop offset="50%" stop-color="#181D2B" />
      <stop offset="100%" stop-color="#0F121C" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="64" height="64" rx="14" fill="#08090D" />
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#1F2538" stroke-width="1.5" />

  <!-- Foundation Steps -->
  <rect x="6" y="52" width="52" height="4" rx="1" fill="#0B0E17" stroke="#242D40" stroke-width="1" />
  <rect x="10" y="48" width="44" height="4" rx="1" fill="url(#m-stone)" stroke="#384462" stroke-width="1" />

  <!-- MONUMENT WALL STELE -->
  <path d="M 12,48 L 12,18 L 18,18 L 22,12 L 32,7 L 42,12 L 46,18 L 52,18 L 52,48 Z" 
        fill="url(#m-stone)" 
        stroke="url(#m-gold)" 
        stroke-width="2" />

  <!-- Apex Pyramidal Keystone / Beacon -->
  <polygon points="32,4 36,9 32,8 28,9" fill="#FFFBEB" stroke="#FDE047" stroke-width="0.8" />
  <circle cx="32" cy="4" r="1.5" fill="#FFFFFF" />

  <!-- Recessed Census Grid Sanctum -->
  <rect x="17" y="21" width="30" height="24" rx="2.5" fill="#05060A" stroke="#262E44" stroke-width="1" />

  <!-- CENSUS MATRIX (3x3) -->
  <!-- Row 1 -->
  <!-- Slot #0001: Golden Genesis Block -->
  <rect x="19" y="23" width="7.5" height="6" rx="1" fill="url(#m-gold)" />
  <circle cx="22.7" cy="26" r="1" fill="#38BDF8" />

  <!-- Slot #0002: Base L2 Cyan -->
  <rect x="28.2" y="23" width="7.5" height="6" rx="1" fill="#0284C7" />
  <rect x="30.5" y="24.8" width="3" height="2.5" rx="0.5" fill="#38BDF8" />

  <!-- Slot #0003: Amber Oracle -->
  <rect x="37.5" y="23" width="7.5" height="6" rx="1" fill="#B45309" />
  <circle cx="41.2" cy="26" r="1.3" fill="#FBBF24" />

  <!-- Row 2 -->
  <rect x="19" y="30" width="7.5" height="6" rx="1" fill="#7C3AED" />
  <rect x="28.2" y="30" width="7.5" height="6" rx="1" fill="#059669" />
  <rect x="37.5" y="30" width="7.5" height="6" rx="1" fill="#2563EB" />

  <!-- Row 3 -->
  <rect x="19" y="37" width="7.5" height="6" rx="1" fill="#E11D48" />
  <rect x="28.2" y="37" width="7.5" height="6" rx="1" fill="#D97706" />
  <rect x="37.5" y="37" width="7.5" height="6" rx="1" fill="#121624" stroke="#28324A" stroke-width="0.6" />

  <!-- Base Cyan Settlement Traces -->
  <line x1="3" y1="54" x2="9" y2="54" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="55" y1="54" x2="61" y2="54" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />
</svg>